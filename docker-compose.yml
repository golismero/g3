# Example docker-compose file for quickly trying out Golismero locally.
# Runs 2 scanner replicas and 4 generic worker replicas by default; adjust deploy.replicas
# in each service to scale. Uncomment the relevant sections to enable debug webapps.

##############################################
## Please do not use this in production !!! ##
##############################################

name: example

# We're going to put everything into the same network since this is a
# trivial example where all containers run in the same host anyway.
networks:
  g3net:
    name: g3net

# Almost all of these services don't need to expose open ports to 127.0.0.1.
# This is done here for debugging, avoid in production.
# Only the API service needs to be exposed in a real life setting,
# and even that one can be put behind a reverse proxy for extra safety.
services:

  # MongoDB is used to store the scan data.
  # There is no specific version required for Golismero, but in
  # this example we used 4.4.6 since it's the most compatible one.
  # https://github.com/docker-library/mongo/issues/485
  mongo:
    image: mongo:4.4.6
    restart: unless-stopped
    # ports:
    #   - "127.0.0.1:27017:27017"
    networks:
      - g3net
    volumes:
      - ./volumes/mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"

  # Mongo Express is useful for debugging.
  # mongo-express:
  #   image: mongo-express
  #   restart: unless-stopped
  #   depends_on:
  #     - mongo
  #   networks:
  #     - g3net
  #   ports:
  #     - "127.0.0.1:8081:8081"
  #   environment:
  #     ME_CONFIG_MONGODB_ADMINUSERNAME: "${MONGO_USERNAME}"
  #     ME_CONFIG_MONGODB_ADMINPASSWORD: "${MONGO_PASSWORD}"
  #     ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/"

  # The MQTT broker is used to coordinate tasks between the scanner and the workers.
  # The broker has no env-var->credential mechanism of its own (unlike mongo/mariadb),
  # so we regenerate its password file from MQTT_USERNAME/MQTT_PASSWORD on every start
  # before launching the broker. This keeps the broker's credentials in sync with .env,
  # the same source the clients (g3api/g3scanner/g3worker) read MQTT_URL from. Note this
  # rewrites volumes/mosquitto/config/password.txt on each `up`.
  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    networks:
      - g3net
    volumes:
      - ./volumes/mosquitto/config:/mosquitto/config/
      - ./volumes/mosquitto/log:/mosquitto/log/
      - ./volumes/mosquitto/data:/mosquitto/data/
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    command:
      - /bin/sh
      - -c
      - |
        rm -f /mosquitto/config/password.txt &&
        mosquitto_passwd -b -c /mosquitto/config/password.txt "$$MQTT_USERNAME" "$$MQTT_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/config/password.txt &&
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
  #  ports:
  #    - "127.0.0.1:1883:1883"
  #    - "127.0.0.1:9001:9001"

  # MQTT Admin is useful for debugging.
  # mqtt-admin:
  #   image: dersimn/mqtt-admin
  #   restart: unless-stopped
  #   depends_on:
  #     - mosquitto
  #   networks:
  #     - g3net
  #   ports:
  #     - "127.0.0.1:8082:80"

  # MQTT Explorer is useful for debugging.
  # mqtt-explorer:
  #   image: smeagolworms4/mqtt-explorer
  #   restart: unless-stopped
  #   depends_on:
  #     - mosquitto
  #   networks:
  #     - g3net
  #   volumes:
  #     - ./volumes/mqtt-explorer:/mqtt-explorer/config
  #   ports:
  #     - "127.0.0.1:4000:4000"

  # In this example we use MariaDB as a SQL database.
  # The SQL database is used to store execution logs from tools.
  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    networks:
      - g3net
    volumes:
      - ./volumes/mariadb/data:/var/lib/mysql
      - ./volumes/mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
  #  ports:
  #    - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${SQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${SQL_DATABASE}"
      MYSQL_USER: "${SQL_USERNAME}"
      MYSQL_PASSWORD: "${SQL_PASSWORD}"

  # PHP My Admin is useful for debugging.
  # phpmyadmin:
  #   image: phpmyadmin/phpmyadmin
  #   restart: unless-stopped
  #   depends_on:
  #     - mariadb
  #   networks:
  #     - g3net
  #   ports:
  #     - "127.0.0.1:8083:80"
  #   environment:
  #     - PMA_HOST=mariadb
  #     - PMA_PORT=3306
  #     - PMA_ARBITRARY=1

  # This is the web server that will serve the app.
  nginx:
    image: nginx:latest
    restart: unless-stopped
    networks:
      - g3net
    volumes:
      - ./www:/var/www
      - ./volumes/nginx:/etc/nginx/conf.d
    ports:
      # - "127.0.0.1:8888:80"
      - "8888:80"

  ############################################################################

  # There is only one instance of the web application, so there's only one API.
  g3api:
    image: ghcr.io/golismero/g3:latest
    entrypoint: /bin/g3api
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
      mongo:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - g3net
    volumes:
      - ./config:/app/config
      - ./volumes/tmp:/tmp
      - ./volumes/artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - G3HOME=/app
      - MONGO_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/
      - SQL_DSN=${SQL_USERNAME}:${SQL_PASSWORD}@tcp(mariadb:3306)/${SQL_DATABASE}
      - MQTT_URL=mqtt://${MQTT_USERNAME}:${MQTT_PASSWORD}@mosquitto:1883/
      - G3_API_ID=g3api
      - G3_API_TOKEN
      - G3_HTTP_ADDR=0.0.0.0
      - G3_HTTP_PORT=8080
      - G3_HTTP_PATH=/api
      - G3_HTTP_BUFFER
      - G3_FILE_UPLOAD_MAX
      - G3_ARTIFACTS_ROOT=/app/artifacts
      - G3_UPLOAD_TTL
      - G3_LOG_LEVEL
      - G3_ENV_IPV6_SUPPORTED

  ############################################################################

  # Scanner and worker instances auto-derive their MQTT client ID from the
  # container's hostname (Docker assigns a unique container ID per replica).
  # Use `deploy.replicas: N` to scale a service horizontally — each replica
  # gets a unique hostname automatically. If running multiple deployments
  # against shared infrastructure, set G3_INSTANCE_PREFIX per-deployment in
  # .env to disambiguate. To use stable named instances instead, set
  # G3_SCANNER_ID / G3_WORKER_ID per service explicitly (which is
  # incompatible with deploy.replicas — one named container).
  g3scanner:
    image: ghcr.io/golismero/g3:latest
    entrypoint: /bin/g3scanner
    restart: unless-stopped
    deploy:
      replicas: 2  # Scale horizontally by changing this number.
    depends_on:
      mariadb:
        condition: service_started
      mongo:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - g3net
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - G3HOME=/app
      - MONGO_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/
      - SQL_DRIVER=mysql
      - SQL_DSN=${SQL_USERNAME}:${SQL_PASSWORD}@tcp(mariadb:3306)/${SQL_DATABASE}
      - MQTT_URL=mqtt://${MQTT_USERNAME}:${MQTT_PASSWORD}@mosquitto:1883/
      - G3_INSTANCE_PREFIX=g3scanner-
      - G3_INSTANCE_TRANSIENT=false
      - G3_SCANNER_PARALLEL_MODE
      - G3_SCANNER_MAX_PIPELINES
      - G3_SCANNER_MAX_DEPTH
      - G3_LOG_LEVEL
      - G3_ENV_IPV6_SUPPORTED

  ############################################################################

  # The following is an example setup for workers, where we assign some to
  # specific tools, and also create a pool of generic workers for the rest
  # of the supported plugins. In production you may want to change this.

  # The first worker in this example will only run the nmap plugin.
  # This is an easy way to ensure we don't have too many concurrent
  # nmap scans coming from the same machine.
  g3worker-nmap:
    image: ghcr.io/golismero/g3:latest
    entrypoint: /bin/g3worker
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
      mongo:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - g3net
    volumes:
      - ./config:/app/config
      - ./resources:/app/resources
      - ./volumes/artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - G3HOME=/app
      - MONGO_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/
      - SQL_DRIVER=mysql
      - SQL_DSN=${SQL_USERNAME}:${SQL_PASSWORD}@tcp(mariadb:3306)/${SQL_DATABASE}
      - MQTT_URL=mqtt://${MQTT_USERNAME}:${MQTT_PASSWORD}@mosquitto:1883/
      - G3_WORKER_ID=g3worker-nmap
      - G3_INSTANCE_TRANSIENT=false
      - G3_WORKER_PLUGINS=nmap,nmap-fast,nmap-full
      - G3_HOLD_CANCEL
      - G3_LOG_LEVEL
      - G3_DOCKER_NETWORK
      - G3_ARTIFACTS_ROOT=/app/artifacts
      - G3_ARTIFACTS_HOST_ROOT=${PWD}/volumes/artifacts
      - G3_ENV_IPV6_SUPPORTED

  # Same for hydra, since it's also quite noisy.
  g3worker-hydra:
    image: ghcr.io/golismero/g3:latest
    entrypoint: /bin/g3worker
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
      mongo:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - g3net
    volumes:
      - ./config:/app/config
      - ./resources:/app/resources
      - ./volumes/artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - G3HOME=/app
      - MONGO_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/
      - SQL_DRIVER=mysql
      - SQL_DSN=${SQL_USERNAME}:${SQL_PASSWORD}@tcp(mariadb:3306)/${SQL_DATABASE}
      - MQTT_URL=mqtt://${MQTT_USERNAME}:${MQTT_PASSWORD}@mosquitto:1883/
      - G3_WORKER_ID=g3worker-hydra
      - G3_INSTANCE_TRANSIENT=false
      - G3_WORKER_PLUGINS=hydra
      - G3_HOLD_CANCEL
      - G3_LOG_LEVEL
      - G3_DOCKER_NETWORK
      - G3_ARTIFACTS_ROOT=/app/artifacts
      - G3_ARTIFACTS_HOST_ROOT=${PWD}/volumes/artifacts
      - G3_ENV_IPV6_SUPPORTED
  # Now we'll do the same for testssl, but using two replicas.
  g3worker-testssl:
    image: ghcr.io/golismero/g3:latest
    entrypoint: /bin/g3worker
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      mariadb:
        condition: service_started
      mongo:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - g3net
    volumes:
      - ./config:/app/config
      - ./resources:/app/resources
      - ./volumes/artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - G3HOME=/app
      - MONGO_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/
      - SQL_DRIVER=mysql
      - SQL_DSN=${SQL_USERNAME}:${SQL_PASSWORD}@tcp(mariadb:3306)/${SQL_DATABASE}
      - MQTT_URL=mqtt://${MQTT_USERNAME}:${MQTT_PASSWORD}@mosquitto:1883/
      - G3_INSTANCE_PREFIX=g3worker-testssl-
      - G3_INSTANCE_TRANSIENT=false
      - G3_WORKER_PLUGINS=testssl
      - G3_HOLD_CANCEL
      - G3_LOG_LEVEL
      - G3_DOCKER_NETWORK
      - G3_ARTIFACTS_ROOT=/app/artifacts
      - G3_ARTIFACTS_HOST_ROOT=${PWD}/volumes/artifacts
      - G3_ENV_IPV6_SUPPORTED

  # The following workers are all identical and run all plugins *except* the ones above.
  # Use deploy.replicas to grow or shrink the generic worker pool.
  g3worker:
    image: ghcr.io/golismero/g3:latest
    entrypoint: /bin/g3worker
    restart: unless-stopped
    deploy:
      replicas: 4
    depends_on:
      mariadb:
        condition: service_started
      mongo:
        condition: service_started
      mosquitto:
        condition: service_started
    networks:
      - g3net
    volumes:
      - ./config:/app/config
      - ./resources:/app/resources
      - ./volumes/artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - G3HOME=/app
      - MONGO_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/
      - SQL_DRIVER=mysql
      - SQL_DSN=${SQL_USERNAME}:${SQL_PASSWORD}@tcp(mariadb:3306)/${SQL_DATABASE}
      - MQTT_URL=mqtt://${MQTT_USERNAME}:${MQTT_PASSWORD}@mosquitto:1883/
      - G3_INSTANCE_PREFIX=g3worker-
      - G3_INSTANCE_TRANSIENT=false
      - G3_WORKER_PLUGINS=!nmap,nmap-fast,nmap-full,testssl,hydra
      - G3_HOLD_CANCEL
      - G3_LOG_LEVEL
      - G3_DOCKER_NETWORK
      - G3_ARTIFACTS_ROOT=/app/artifacts
      - G3_ARTIFACTS_HOST_ROOT=${PWD}/volumes/artifacts
      - G3_ENV_IPV6_SUPPORTED
  
  ############################################################################
