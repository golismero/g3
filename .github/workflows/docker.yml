name: Build & Push Docker Images

on:
  push:
    tags:
      # Strict vX.Y.Z (three integer segments). Same shape as release.yml so
      # every image build corresponds 1:1 with a GitHub Release. Minimatch
      # `+` requires at least one digit per segment; the glob is anchored,
      # so v1.2, v1.2.3.4, v1.2.3-rc1, vendor-foo etc. are all rejected.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}

jobs:

  # Restrict manual dispatch to `main` (rebuilds :latest) or vX.Y.Z tags
  # (rebuilds a specific release). All other refs are rejected.
  #
  # Normal triggers bypass this guard: tag pushes match the trigger glob
  # above (same vX.Y.Z shape), and workflow_call from CI.yml is already
  # gated on `github.ref == 'refs/heads/main'` upstream.
  #
  # To allow specific branches to produce images in the future, pick a
  # naming convention to distinguish "image-producing" branches from
  # regular development branches (e.g. `preview/*` or `image-*`), then
  # widen the bash check below to also accept that pattern. Also consider
  # adding a janitor step to remove the resulting branch-named tags when
  # the branch is deleted — the cleanup action at the end of this job
  # only removes *untagged* versions, so branch-tagged images would
  # otherwise accumulate in GHCR forever.
  guard:
    name: Guard - restrict manual dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Bash regex because GitHub Actions expressions can't anchor character
      # classes — we want exactly main or vX.Y.Z, same shape as the trigger
      # glob. Skipped on tag push and workflow_call (filters already enforce
      # the shape upstream).
      - name: Reject non-main, non-version refs on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == "refs/heads/main" ]]; then
            exit 0
          fi
          if [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          echo "::error::docker.yml manual dispatch only supports main or vX.Y.Z tags. Got: $REF"
          exit 1

  build-and-push:
    name: Build & Push (${{ matrix.image }})
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: g3
            context: .
            prep: go-deps
          - image: hydra
            context: plugins/attack/hydra
          - image: nikto
            context: plugins/attack/nikto
            prep: osvdb2cve
          - image: error
            context: plugins/debug/error
          - image: force-exec
            context: plugins/debug/force-exec
          - image: passthrough
            context: plugins/debug/passthrough
          - image: dig
            context: plugins/misc/dig
          - image: nmap
            context: plugins/recon/nmap
            prep: iana-descriptions
          - image: subfinder
            context: plugins/recon/subfinder
          - image: testssl
            context: plugins/recon/testssl
          - image: wafw00f
            context: plugins/recon/wafw00f
    steps:
      - uses: actions/checkout@v4

      # Toolchains for prep steps. The Dockerfile for g3 expects
      # ./misc/deps.txt to exist before the build — it's generated from
      # src/*/go.sum after `go mod tidy`, so Go must run on the host.
      - name: Set up Go
        if: matrix.prep == 'go-deps'
        uses: actions/setup-go@v5

      # Two plugins (nikto, nmap) bake downloaded reference data
      # into their image at build time. The scripts live in ./misc/ and need
      # beautifulsoup4 + lxml (see misc/requirements.txt).
      - name: Set up Python
        if: matrix.prep == 'osvdb2cve' || matrix.prep == 'iana-descriptions'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install asset-generator dependencies
        if: matrix.prep == 'osvdb2cve' || matrix.prep == 'iana-descriptions'
        run: pip install -r misc/requirements.txt

      # Cache the deterministic outputs of the three asset-generator prep
      # scripts. Each script pins a source URL and produces a single output
      # file, so hashing the script is sufficient to invalidate the cache
      # when the URL, schema, or parsing logic changes. On a hit, the prep
      # step is skipped entirely.
      - name: Cache OSVDB to CVE map (nikto)
        if: matrix.prep == 'osvdb2cve'
        id: cache-osvdb2cve
        uses: actions/cache@v4
        with:
          path: plugins/attack/nikto/osvdb2cve.json
          key: osvdb2cve-${{ hashFiles('misc/osvdb2cve.py') }}

      - name: Cache IANA port descriptions (nmap)
        if: matrix.prep == 'iana-descriptions'
        id: cache-iana-descriptions
        uses: actions/cache@v4
        with:
          path: plugins/recon/nmap/iana-descriptions.json
          key: iana-descriptions-${{ hashFiles('misc/iana-descriptions.py') }}

      - name: Prep - collect Go module dependencies
        if: matrix.prep == 'go-deps'
        run: |
          set -e
          for d in src/*/; do (cd "$d" && go mod tidy); done
          ./misc/collect-go-deps.py ./misc/deps.txt

      - name: Prep - generate OSVDB to CVE map (nikto)
        if: matrix.prep == 'osvdb2cve' && steps.cache-osvdb2cve.outputs.cache-hit != 'true'
        working-directory: plugins/attack/nikto
        run: python3 ../../../misc/osvdb2cve.py

      - name: Prep - generate IANA port descriptions (nmap)
        if: matrix.prep == 'iana-descriptions' && steps.cache-iana-descriptions.outputs.cache-hit != 'true'
        working-directory: plugins/recon/nmap
        run: python3 ../../../misc/iana-descriptions.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache is shared across branches (content-addressed). If divergent
          # dependencies cause thrashing, scope per branch by appending
          # -${{ github.ref_name }} to the buildcache tag.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max

      # Remove orphaned (untagged) versions that accumulate every time a new
      # build replaces :latest or :buildcache. Runs per-image so one image's
      # cleanup failure doesn't block the others (fail-fast: false above).
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ matrix.image }}
          delete-untagged: true
          token: ${{ secrets.GITHUB_TOKEN }}
