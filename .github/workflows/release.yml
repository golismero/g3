name: Release Binaries

# Cross-compiles the release binaries and attaches them to the GitHub
# Release matching the pushed tag. Triggered only by tag pushes that look
# like a version (v1.2.3, v0.1.0-rc1, etc.) — main branch CI is handled
# separately by CI.yml.
#
# Two parallel artifacts are produced per platform:
#   - g3-${VERSION}-${TARGET}.zip       : g3cli + g3tui (six targets,
#                                         linux/macos/windows × amd64/arm64)
#   - g3-local-${VERSION}-${TARGET}.zip : g3 + config/ (four targets,
#                                         linux/macos × amd64/arm64)
#
# g3 is omitted from windows targets because it shells out to `docker run`
# with Unix-style relative paths and host-path mounts that don't translate
# cleanly under Docker Desktop for Windows. WSL users on Windows can run
# the linux-x86_64 local zip instead.
#
# All binaries are pure Go (no cgo), so every target builds on a single
# ubuntu-latest image via GOOS/GOARCH env vars. No QEMU, no per-OS runners
# needed.

on:
  push:
    tags:
      # Strict vX.Y.Z (three integer segments). Minimatch `+` means "one or
      # more of the preceding character", so [0-9]+ requires at least one
      # digit per segment. Anchored at both ends, so vendor-foo, v1.2,
      # v1.2.3.4, v1.2.3-rc1, etc. are all rejected.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:

  # Reject workflow_dispatch runs that selected a branch instead of a tag.
  # Tag pushes skip the guarded step (github.ref starts with refs/tags/),
  # so this is a no-op for the normal release flow. Manual dispatches that
  # pick a branch fail loudly here instead of producing orphan binaries
  # with `main` baked in as the version string and a release upload that
  # errors out anyway.
  guard:
    name: Guard - require version tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Bash regex because GitHub Actions expressions can't anchor character
      # classes — we want exactly vX.Y.Z, same shape as the trigger glob.
      # Skipped on tag push (the trigger filter already enforced the shape).
      - name: Reject non-version refs on workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          echo "::error::release.yml must be dispatched against a vX.Y.Z tag. Got: $REF"
          exit 1

  cross-compile:
    name: Build (${{ matrix.target }})
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `target` is the user-facing platform label embedded in the zip
        # filename. `goos`/`goarch` are the Go toolchain values (e.g. amd64,
        # not x86_64). `ext` is appended to each binary name — empty on
        # Unix-like systems, `.exe` on Windows.
        include:
          - target: linux-x86_64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: windows-x86_64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
          - target: macos-x86_64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      # go.mod is the authoritative source for the Go toolchain version
      # (matches the convention used throughout CI.yml). Either binary's
      # go.mod works — they're kept in lockstep — so we read from g3tui.
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/g3tui/go.mod

      # All template expressions are routed through env: so the values are
      # exposed as plain bash variables. Inlining `${{ ... }}` directly into
      # `run:` blocks is a known workflow-injection vector — even when the
      # source looks safe (tag names, matrix values), env routing keeps the
      # value out of the shell parser.
      - name: Build client binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -e
          mkdir -p "dist/${TARGET}"
          for bin in g3tui g3cli g3man; do
            ( cd "src/${bin}" && \
              go build \
                -trimpath \
                -ldflags="-s -w -X main.Version=${VERSION}" \
                -o "../../dist/${TARGET}/${bin}${EXT}" \
                . )
          done

      # Flat zip — `cd` into the per-target dir so the archive contains the
      # binaries at the root (no embedded "dist/linux-x86_64/" prefix). Users
      # who download the zip get `g3tui` and `g3cli` directly on extract.
      - name: Create zip
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          cd "dist/${TARGET}"
          zip "../../g3-${VERSION}-${TARGET}.zip" *

      - uses: actions/upload-artifact@v4
        with:
          name: g3-${{ matrix.target }}
          path: g3-${{ github.ref_name }}-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  cross-compile-local:
    name: Build local (${{ matrix.target }})
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
          - target: macos-x86_64
            goos: darwin
            goarch: amd64
          - target: macos-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      # All four cross-compile modules share the same Go toolchain version,
      # so reading from any module's go.mod works. g3's go.mod is the
      # natural pick for this job.
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/g3/go.mod

      # g3config builds natively (no GOOS/GOARCH override — it only runs on
      # the runner) and emits the platform-agnostic plugin registry JSONs
      # under config/. Each matrix target regenerates independently rather
      # than sharing a prep-job artifact: the work is a few seconds and the
      # artifact wiring would be more code than the duplication saves.
      - name: Generate plugin registry
        run: |
          set -e
          ( cd src/g3config && go build -trimpath -o ../../bin/g3config . )
          ./bin/g3config -q

      # GOOS/GOARCH apply only to this cross-compile step. CGO_ENABLED=0
      # produces a static binary identical in shape to the g3cli/g3tui
      # outputs — same -trimpath, same -ldflags, same Version injection.
      - name: Build g3
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          mkdir -p "dist/${TARGET}"
          ( cd src/g3 && \
            go build \
              -trimpath \
              -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "../../dist/${TARGET}/g3" \
              . )

      # config/ is shipped alongside the binary so a freshly extracted zip
      # is immediately runnable — g3 resolves its registry path relative
      # to the binary's parent dir, so the flat zip layout Just Works.
      # The .gitignore inside config/ exists only to keep generated JSONs
      # out of source control; it has no meaning at runtime and is
      # explicitly dropped from the release artifact.
      - name: Stage plugin registry
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          cp -r config "dist/${TARGET}/config"
          rm -f "dist/${TARGET}/config/.gitignore"

      # Flat zip — `cd` into the per-target dir so the archive contains
      # `g3` and `config/` at the root with no embedded path prefix.
      - name: Create zip
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          cd "dist/${TARGET}"
          zip -r "../../g3-local-${VERSION}-${TARGET}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: g3-local-${{ matrix.target }}
          path: g3-local-${{ github.ref_name }}-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach to Release
    needs: [cross-compile, cross-compile-local]
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release (if it doesn't exist yet) and upload
      # assets. Scoped to this job only — the matrix job above stays
      # contents: read.
      contents: write
    steps:
      # `merge-multiple: true` flattens all six matrix artifacts into one
      # directory, so the subsequent glob picks up every zip without
      # walking nested per-artifact dirs.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Produces one `<zip>.sha256` per zip in canonical `sha256sum` format
      # (hash, two spaces, filename). Generating from inside `dist/` records
      # bare filenames, so `sha256sum -c g3-...-linux-x86_64.zip.sha256`
      # verifies correctly from wherever the user extracts.
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          set -e
          for f in *.zip; do
            sha256sum "$f" > "${f}.sha256"
          done

      # softprops/action-gh-release creates the release if it doesn't exist
      # and appends assets if it does — safe to re-run on the same tag.
      # `fail_on_unmatched_files` ensures the workflow fails loudly if the
      # download step produced nothing instead of silently publishing an
      # empty release.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true
