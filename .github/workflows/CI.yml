name: Build & Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}

jobs:

  ruff:
    name: Ruff (Python)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  hadolint:
    name: Hadolint (Dockerfile)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      # Restrict to tracked Dockerfiles so volumes/ and other untracked
      # paths can't sneak in. Picks up .hadolint.yml from the repo root.
      - name: Lint Dockerfiles
        run: git ls-files '*Dockerfile*' | xargs -r hadolint

  # Detect which Go modules a push touched, so golangci-lint only runs for
  # modules whose source (or whose shared-library deps) actually changed.
  # g3log has no internal deps; g3lib depends on g3log; the six binaries
  # depend on both — so a change to g3log fans out to everything, a change
  # to g3lib fans out to the binaries (but not g3log), and a change inside
  # a binary's own dir affects only that binary.
  #
  # The dorny step is gated on push events; for workflow_dispatch and
  # workflow_call the outputs stay empty and the golangci `if:` below
  # short-circuits to "run all".
  detect:
    name: Detect changed Go modules
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      g3: ${{ steps.filter.outputs.g3 }}
      g3api: ${{ steps.filter.outputs.g3api }}
      g3cli: ${{ steps.filter.outputs.g3cli }}
      g3config: ${{ steps.filter.outputs.g3config }}
      g3lib: ${{ steps.filter.outputs.g3lib }}
      g3log: ${{ steps.filter.outputs.g3log }}
      g3scanner: ${{ steps.filter.outputs.g3scanner }}
      g3worker: ${{ steps.filter.outputs.g3worker }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            g3log:
              - 'src/g3log/**'
            g3lib:
              - 'src/g3lib/**'
              - 'src/g3log/**'
            g3:
              - 'src/g3/**'
              - 'src/g3lib/**'
              - 'src/g3log/**'
            g3api:
              - 'src/g3api/**'
              - 'src/g3lib/**'
              - 'src/g3log/**'
            g3cli:
              - 'src/g3cli/**'
              - 'src/g3lib/**'
              - 'src/g3log/**'
            g3config:
              - 'src/g3config/**'
              - 'src/g3lib/**'
              - 'src/g3log/**'
            g3scanner:
              - 'src/g3scanner/**'
              - 'src/g3lib/**'
              - 'src/g3log/**'
            g3worker:
              - 'src/g3worker/**'
              - 'src/g3lib/**'
              - 'src/g3log/**'

  golangci:
    name: golangci-lint (${{ matrix.module }})
    needs: [detect]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [g3, g3api, g3cli, g3config, g3lib, g3log, g3scanner, g3worker]
    # `matrix` isn't available in job-level `if:`, but it is available in
    # job-level `env:`. Compose the gate here and each meaningful step
    # references SHOULD_RUN. Skip a matrix cell only when this is a push
    # and the detect job said the module's filter didn't match; any other
    # event (workflow_dispatch, workflow_call) runs the full matrix.
    env:
      SHOULD_RUN: ${{ github.event_name != 'push' || needs.detect.outputs[matrix.module] == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.SHOULD_RUN == 'true'
      - uses: actions/setup-go@v5
        if: env.SHOULD_RUN == 'true'
        with:
          go-version-file: src/${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@v9
        if: env.SHOULD_RUN == 'true'
        with:
          working-directory: src/${{ matrix.module }}
          version: latest

  smoke-tests:
    name: Smoke Tests
    # `detect` is in needs so that if dorny fails on a push, smoke-tests
    # surfaces it instead of letting golangci silently skip.
    needs: [ruff, hadolint, detect, golangci]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  build-and-push:
    name: Build & Push (${{ matrix.image }})
    needs: [smoke-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: g3
            context: .
            prep: go-deps
          - image: hydra
            context: plugins/attack/hydra
          - image: nikto
            context: plugins/attack/nikto
            prep: osvdb2cve
          - image: dig
            context: plugins/misc/dig
          - image: nmap
            context: plugins/recon/nmap
            prep: iana-descriptions
          - image: subfinder
            context: plugins/recon/subfinder
          - image: sublist3r
            context: plugins/recon/sublist3r
          - image: testssl
            context: plugins/recon/testssl
          - image: vulners
            context: plugins/recon/vulners
            prep: cpe-dictionary
          - image: wafw00f
            context: plugins/recon/wafw00f
    steps:
      - uses: actions/checkout@v4

      # Toolchains for prep steps. The Dockerfile for g3 expects
      # ./misc/deps.txt to exist before the build — it's generated from
      # src/*/go.sum after `go mod tidy`, so Go must run on the host.
      - name: Set up Go
        if: matrix.prep == 'go-deps'
        uses: actions/setup-go@v5

      # Three plugins (nikto, nmap, vulners) bake downloaded reference data
      # into their image at build time. The scripts live in ./misc/ and need
      # beautifulsoup4 + lxml (see misc/requirements.txt).
      - name: Set up Python
        if: matrix.prep == 'osvdb2cve' || matrix.prep == 'iana-descriptions' || matrix.prep == 'cpe-dictionary'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install asset-generator dependencies
        if: matrix.prep == 'osvdb2cve' || matrix.prep == 'iana-descriptions' || matrix.prep == 'cpe-dictionary'
        run: pip install -r misc/requirements.txt

      # Cache the deterministic outputs of the three asset-generator prep
      # scripts. Each script pins a source URL and produces a single output
      # file, so hashing the script is sufficient to invalidate the cache
      # when the URL, schema, or parsing logic changes. On a hit, the prep
      # step is skipped entirely.
      - name: Cache OSVDB to CVE map (nikto)
        if: matrix.prep == 'osvdb2cve'
        id: cache-osvdb2cve
        uses: actions/cache@v4
        with:
          path: plugins/attack/nikto/osvdb2cve.json
          key: osvdb2cve-${{ hashFiles('misc/osvdb2cve.py') }}

      - name: Cache IANA port descriptions (nmap)
        if: matrix.prep == 'iana-descriptions'
        id: cache-iana-descriptions
        uses: actions/cache@v4
        with:
          path: plugins/recon/nmap/iana-descriptions.json
          key: iana-descriptions-${{ hashFiles('misc/iana-descriptions.py') }}

      - name: Cache CPE dictionary (vulners)
        if: matrix.prep == 'cpe-dictionary'
        id: cache-cpe-dictionary
        uses: actions/cache@v4
        with:
          path: plugins/recon/vulners/cpe.db
          key: cpe-dictionary-${{ hashFiles('misc/cpe-dictionary.py') }}

      - name: Prep - collect Go module dependencies
        if: matrix.prep == 'go-deps'
        run: |
          set -e
          for d in src/*/; do (cd "$d" && go mod tidy); done
          ./misc/collect-go-deps.py ./misc/deps.txt

      - name: Prep - generate OSVDB to CVE map (nikto)
        if: matrix.prep == 'osvdb2cve' && steps.cache-osvdb2cve.outputs.cache-hit != 'true'
        working-directory: plugins/attack/nikto
        run: python3 ../../../misc/osvdb2cve.py

      - name: Prep - generate IANA port descriptions (nmap)
        if: matrix.prep == 'iana-descriptions' && steps.cache-iana-descriptions.outputs.cache-hit != 'true'
        working-directory: plugins/recon/nmap
        run: python3 ../../../misc/iana-descriptions.py

      - name: Prep - build CPE dictionary (vulners)
        if: matrix.prep == 'cpe-dictionary' && steps.cache-cpe-dictionary.outputs.cache-hit != 'true'
        working-directory: plugins/recon/vulners
        run: python3 ../../../misc/cpe-dictionary.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache is shared across branches (content-addressed). If divergent
          # dependencies cause thrashing, scope per branch by appending
          # -${{ github.ref_name }} to the buildcache tag.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max

      # Remove orphaned (untagged) versions that accumulate every time a new
      # build replaces :latest or :buildcache. Runs per-image so one image's
      # cleanup failure doesn't block the others (fail-fast: false above).
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: ${{ matrix.image }}
          delete-untagged: true
          token: ${{ secrets.GITHUB_TOKEN }}
