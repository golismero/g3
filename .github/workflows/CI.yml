name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:

  ruff:
    name: Ruff (Python)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  hadolint:
    name: Hadolint (Dockerfile)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      # Restrict to tracked Dockerfiles so volumes/ and other untracked
      # paths can't sneak in. Picks up .hadolint.yml from the repo root.
      - name: Lint Dockerfiles
        run: git ls-files '*Dockerfile*' | xargs -r hadolint

  # Detect which Go modules a push touched, so golangci-lint only runs for
  # modules whose source (or whose shared-library deps) actually changed.
  #
  # The dorny step is gated on push events; for workflow_dispatch and
  # workflow_call the outputs stay empty and the golangci `if:` below
  # short-circuits to "run all".
  detect:
    name: Detect changed Go modules
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      g3: ${{ steps.filter.outputs.g3 }}
      g3api: ${{ steps.filter.outputs.g3api }}
      g3bin: ${{ steps.filter.outputs.g3bin }}
      g3cli: ${{ steps.filter.outputs.g3cli }}
      g3config: ${{ steps.filter.outputs.g3config }}
      g3lib: ${{ steps.filter.outputs.g3lib }}
      g3scanner: ${{ steps.filter.outputs.g3scanner }}
      g3tui: ${{ steps.filter.outputs.g3tui }}
      g3worker: ${{ steps.filter.outputs.g3worker }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            g3:
              - 'src/g3/**'
            g3lib:
              - 'src/g3/**'
              - 'src/g3lib/**'
            g3api:
              - 'src/g3/**'
              - 'src/g3lib/**'
              - 'src/g3api/**'
            g3bin:
              - 'src/g3/**'
              - 'src/g3lib/**'
              - 'src/g3bin/**'
            g3cli:
              - 'src/g3/**'
              - 'src/g3lib/**'
              - 'src/g3cli/**'
            g3config:
              - 'src/g3/**'
              - 'src/g3lib/**'
              - 'src/g3config/**'
            g3scanner:
              - 'src/g3/**'
              - 'src/g3lib/**'
              - 'src/g3scanner/**'
            g3tui:
              - 'src/g3/**'
              - 'src/g3lib/**'
              - 'src/g3tui/**'
            g3worker:
              - 'src/g3/**'
              - 'src/g3lib/**'
              - 'src/g3worker/**'

  golangci:
    name: golangci-lint (${{ matrix.module }})
    needs: [detect]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [g3, g3api, g3bin, g3cli, g3config, g3lib, g3scanner, g3tui, g3worker]
    # `matrix` isn't available in job-level `if:`, but it is available in
    # job-level `env:`. Compose the gate here and each meaningful step
    # references SHOULD_RUN. Skip a matrix cell only when this is a push
    # and the detect job said the module's filter didn't match; any other
    # event (workflow_dispatch, workflow_call) runs the full matrix.
    env:
      SHOULD_RUN: ${{ github.event_name != 'push' || needs.detect.outputs[matrix.module] == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: env.SHOULD_RUN == 'true'
      - uses: actions/setup-go@v5
        if: env.SHOULD_RUN == 'true'
        with:
          go-version-file: src/${{ matrix.module }}/go.mod
      - uses: golangci/golangci-lint-action@v9
        if: env.SHOULD_RUN == 'true'
        with:
          working-directory: src/${{ matrix.module }}
          version: latest

  smoke-tests:
    name: Smoke Tests
    # `detect` is in needs so that if dorny fails on a push, smoke-tests
    # surfaces it instead of letting golangci silently skip.
    needs: [ruff, hadolint, detect, golangci]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  docker:
    name: Build & Push Docker Images
    needs: [smoke-tests]
    # Only produce images when running on main. workflow_dispatch and
    # workflow_call against feature branches still get lint + smoke-tests
    # for free, but skip the docker build so we don't pollute GHCR with
    # branch-named tags. To force a build against another ref, dispatch
    # docker.yml directly from its own Actions page.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
